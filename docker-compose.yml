# docker-compose.yml
version: '3.8'

services:
  bookeeper:
    build: .
    container_name: bookeeper
    ports:
      - "8899:8899"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./covers:/app/covers
      - ./config.json:/app/config.json
    environment:
      - BOOKEEPER_DATABASE_PATH=/app/data/books.db
      - BOOKEEPER_WEB_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - bookeeper-network

  nginx:
    image: nginx:alpine
    container_name: bookeeper-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - bookeeper
    restart: unless-stopped
    networks:
      - bookeeper-network
    profiles:
      - with-nginx

networks:
  bookeeper-network:
    driver: bridge